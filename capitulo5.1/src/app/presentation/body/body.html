<div class="container py-5">
    <div class="card shadow mx-auto">
        <div class="card-body text-center">
            <h1>{{data()}}</h1>
            <div class="d-flex justify-content-center gap-3">
                <button class="btn btn-danger" (click)="dec()">-</button>
                <button class="btn btn-success" (click)="inc()" >+</button>
            </div>
            <div class="d-flex gap-2">
                <input class="form-control" type="number"  #textInput (input)="dataInput.set(textInput.value)">
                <button class="btn btn-warning" (click)="reload()"> reload</button>

            </div>
        </div>
    </div>
</div>
