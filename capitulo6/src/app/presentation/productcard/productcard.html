<div class="card h-100 shadow-sm">
    <div class="card-body">

        <h3 class="card-title fw-bold">{{product()?.name}}</h3> 

        <p  class= "card-text"> 
            <strong> Marca:</strong> {{product()?.brand}}
        </p>
        <p  class="card-text"> 
             {{product()?.description}}
        </p>
        <p  class="card-text fs-4 fw-bold text-primary"> ${{product()?.price}}</p>
        <button class="btn btn-danger" (click)="emitProductName()"> X</button>

    </div>
</div>
