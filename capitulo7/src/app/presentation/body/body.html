<div class="container py-4">
    <div class="row g-4">

        <div class="col-12 col-lg-4">

            <app-petform (newPet)="insert($event)">

            </app-petform>
        </div>
        <div class="col-12 col-lg-8">
            <h2 class=" text-center">Mascotas registradas</h2>
            <div class="row g-3">
                @for (t of pets(); track $index) {
                    <div class=" col-12 col-md-6">
                        <app-petcard [pet]="t"
                        (namePet)="delete($event)">

                        </app-petcard>

                    </div>
                }@empty {
                    <div class="col-12">
                          <p class="alert alert-info">no hay mascotas registradas</p>
                        
                    </div>
                  
                }
            </div>
            
        </div>

    </div>

</div>
